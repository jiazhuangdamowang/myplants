<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>我的植物 · 浇水仪表盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#2f3a33; --soft:#7b8479; --line:#e6dfd0;
  --leaf:#5f8f62; --water:#4f93bd; --waterbg:#e3f0f7; --warn:#c8743f; --warnbg:#fbe9dc; --ok:#6f9a6b; --okbg:#e6f0e2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.serif{font-family:"ZCOOL XiaoWei","Noto Serif SC",serif}
#app{max-width:520px;margin:0 auto;padding:18px 14px 110px}
header h1{font-family:"ZCOOL XiaoWei",serif;font-weight:400;font-size:28px;margin:4px 0 2px;letter-spacing:1px}
header .sub{color:var(--soft);font-size:13px}
.weather{margin:14px 0 10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.wtop{display:flex;align-items:center;gap:12px}
.wtop .temp{font-size:34px;font-family:"ZCOOL XiaoWei",serif}
.wtop .desc{font-size:13px;color:var(--soft);line-height:1.5}
.wdays{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.wd{flex:1;min-width:40px;text-align:center;font-size:11px;color:var(--soft);padding:6px 0;border-radius:10px}
.wd b{display:block;color:var(--ink);font-weight:500;font-size:12px;margin:3px 0}
.wd.today{background:var(--waterbg)}
.wnote{margin-top:10px;font-size:12px;color:var(--soft);line-height:1.6;border-top:1px dashed var(--line);padding-top:8px}
.summary{display:flex;gap:8px;margin:12px 0}
.sum{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sum .n{font-size:24px;font-family:"ZCOOL XiaoWei",serif}
.sum .l{font-size:12px;color:var(--soft)}
.sum.due .n{color:var(--water)}
.sum.late .n{color:var(--warn)}
.sum.fert .n{color:#8a6d2f}
.fline{font-size:11px;margin:-4px 2px 8px;padding:4px 8px;border-radius:8px;background:#f6efdc;color:#8a6d2f;cursor:pointer}
.fline.done{background:var(--okbg);color:var(--ok)}
.chips{display:flex;gap:6px;margin:6px 0 12px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 8px 10px;position:relative;display:flex;flex-direction:column}
.card .art{background:#ffffff;border-radius:13px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card .art svg{width:92%;height:92%}
.card .name{margin:8px 2px 2px;display:flex;align-items:baseline;gap:6px;cursor:pointer}
.card .no{font-family:"ZCOOL XiaoWei",serif;color:var(--soft);font-size:14px}
.card .nm{font-size:15px;font-weight:600;line-height:1.25}
.card .meta{font-size:11px;color:var(--soft);margin:0 2px 8px}
.pill{position:absolute;top:14px;left:14px;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.pill.due{background:var(--waterbg);color:var(--water);font-weight:600}
.pill.late{background:var(--warnbg);color:var(--warn);font-weight:600}
.pill.none{background:#eee9de;color:var(--soft)}
.btn-water{margin-top:auto;border:0;border-radius:12px;padding:9px 0;font-size:14px;background:var(--waterbg);color:var(--water);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-water.done{background:var(--okbg);color:var(--ok)}
.btn-water.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.94)}100%{transform:scale(1)}}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:13px 22px;font-size:15px;box-shadow:0 6px 20px rgba(47,58,51,.25);display:flex;gap:8px;align-items:center;z-index:5}
.rules{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.7;color:#4a544c}
.rules summary{font-weight:600;color:var(--ink);cursor:pointer}
.mask{position:fixed;inset:0;background:rgba(30,35,30,.35);display:none;z-index:10}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 18px 28px;max-height:86vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s;z-index:11}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:"ZCOOL XiaoWei",serif;font-weight:400;font-size:22px;margin:4px 0}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sheet label{font-size:12px;color:var(--soft)}
.sheet input[type=text],.sheet select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;background:#fff;color:var(--ink)}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink)}
.sbtn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.box{background:#f7f3ea;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;margin:10px 0}
.box b{color:var(--ink)}
.log{font-size:13px;color:#4a544c}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;transition:.2s;z-index:20;display:flex;gap:12px;align-items:center;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast button{background:none;border:0;color:#bfe0f2;font-size:13px;padding:0}
.sync{font-size:11px;color:var(--soft);text-align:center;margin-top:14px}
.tag{display:inline-block;font-size:11px;background:#f0e9da;color:#8a7a5a;border-radius:6px;padding:1px 6px;margin-left:4px}
</style>
</head>
<body>
<div id="app"></div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- 天气：南京（11/12 获取的预报快照；预报范围外用南京历年同月平均） ---------- */
const FORECAST = {
  updated: "2026-11-12",
  now: {t:15.8, text:"小雨"},
  days: [
    {d:"2026-11-12",hi:16.7,lo:11.3,rain:65},{d:"2026-11-13",hi:16.2,lo:12.8,rain:65},
    {d:"2026-11-14",hi:16.4,lo:13.0,rain:35},{d:"2026-11-15",hi:17.5,lo:12.5,rain:10},
    {d:"2026-11-16",hi:16.4,lo:11.5,rain:15},{d:"2026-11-17",hi:12.6,lo:9.6,rain:65},
    {d:"2026-11-18",hi:12.3,lo:2.5,rain:5},{d:"2026-11-19",hi:12.6,lo:2.7,rain:10}
  ]
};
// 南京月均气温(℃)与相对湿度(%)，1–12 月
const CLIMATE_T  = [3,5.5,10,16,21.5,25,28.5,28,23.5,18,11,5];
const CLIMATE_RH = [74,73,72,71,71,78,81,81,78,75,75,73];

// 独立网页（GitHub Pages / 本地打开）时不在 Claude 里：可直接下载 .ics、可联网取实时天气
const IN_CLAUDE = !!window.claude;
/* ---------- 植物 ---------- */
// place: 室内 / 阳台；base: 春秋 20℃ 左右时的基础浇水天数
const PLANTS = [
 {id:"p01",name:"吊兰",kind:"grass",pot:["vase","#d8c7a6"],place:"室内",base:5,grp:"leafy",
  tip:"盆土表面 2cm 干了再浇，一次浇透。叶尖发焦多半是太干或水里盐分多。",thirsty:"叶片变软下垂、颜色发灰"},
 {id:"p02",name:"斑叶竹节秋海棠",kind:"begonia",pot:["taper","#4a4640","dots"],place:"室内",base:5,grp:"leafy",
  tip:"怕积水也怕干透，表土干 1–2cm 就浇。叶面别喷水，容易长斑。",thirsty:"叶片下垂、边缘卷"},
 {id:"p03",name:"琴叶榕",kind:"fiddle",pot:["square","#f4f2ee"],place:"室内",base:7,grp:"leafy",
  tip:"喜光、怕频繁挪动。盆土干到一半再浇透；冬天宁干勿湿。",thirsty:"大叶片发软、微微下垂"},
 {id:"p04",name:"火焰酢浆草",kind:"oxalis",pot:["hex","#7fb9a0"],place:"阳台",base:1,fixed:true,grp:"leafy",unsure:true,
  tip:"按你的习惯基本每天浇。盆小、火山石颗粒土干得很快。阴雨天如果表土还湿，可以隔一天再浇。",thirsty:"小叶片合拢、耷拉"},
 {id:"p05",name:"黑叶观音莲",kind:"alocasia",pot:["clear","#8fb5ad","leca"],place:"阳台",base:5,grp:"leafy",
  tip:"种在陶粒里，排水快。冬季低于 15℃ 会半休眠，要明显少浇。",thirsty:"叶柄变软、叶片下垂"},
 {id:"p06",name:"白犀牛海芋",kind:"silver",pot:["round","#d9b9cf"],place:"阳台",base:3,fixed:true,range:[5,35],grp:"leafy",
  tip:"固定 3 天浇一次。适宜温度 5–35℃，低于 5℃ 要搬进屋里。",thirsty:"叶片变薄、失去光泽、叶柄发软"},
 {id:"p07",name:"白掌",kind:"spath",pot:["taper","#5b7fb5"],place:"室内",base:4,grp:"leafy",
  tip:"最会“报信”的植物：叶子一垂就该浇了，浇透后几小时就能挺起来。",thirsty:"整株叶片明显下垂"},
 {id:"p08",name:"箭羽竹芋",kind:"calathea",pot:["taper","#c8dc7a"],place:"阳台",base:4,grp:"humid",
  tip:"喜欢一直微微湿润和空气湿度高；干燥时叶片会卷。用放置过的自来水更好。",thirsty:"叶片卷成筒、叶缘焦"},
 {id:"p09",name:"兔脚蕨（上板）",kind:"fern",pot:["board","#d9b98c"],place:"阳台",base:3,grp:"humid",
  tip:"上板的水苔干得很快：整块板泡水 5–10 分钟，平时多喷雾。",thirsty:"水苔变轻、发白，叶片发黄"},
 {id:"p10",name:"生石花",kind:"lithops",pot:["small","#f0d7b8","cherry"],place:"阳台",base:14,grp:"succ",
  tip:"秋冬是生长期但仍要少水；脱皮期（老皮发皱）停水。沿盆边少量浇。",thirsty:"球体明显起皱、变软"},
 {id:"p11",name:"树形多肉",kind:"tree",pot:["round","#a9795a"],place:"阳台",base:10,grp:"succ",unsure:true,
  tip:"干透浇透，多晒太阳防徒长（枝条拉长就是缺光）。",thirsty:"叶片变皱、变薄"},
 {id:"p12",name:"鱼骨令箭",kind:"fishbone",pot:["bucket","#b9bfc4"],place:"阳台",base:7,grp:"semi",
  tip:"附生仙人掌，比普通多肉喜水，表土干了就浇，怕暴晒。",thirsty:"茎片变薄、发软"},
 {id:"p13",name:"十二卷（红宝石系）",kind:"haworthia",pot:["cyl","#efe9df"],place:"阳台",base:10,grp:"succ",unsure:true,
  tip:"喜散射光，冬季低于 10℃ 控水。浇水避开叶心。",thirsty:"叶片变瘪、叶尖干枯"},
 {id:"p14",name:"石莲花",kind:"echeveria",pot:["cyl","#f2f0ea"],place:"阳台",base:10,grp:"succ",
  tip:"干透浇透，从盆边浇，别让叶心积水。",thirsty:"底部叶片发软起皱"},
 {id:"p15",name:"长寿花",kind:"kalanchoe",pot:["frill","#efe8da"],place:"阳台",base:7,grp:"semi",
  tip:"耐旱，盆土干了再浇。短日照会促进开花，冬天多晒太阳。",thirsty:"叶片变软、失去肉感"},
 {id:"p16",name:"金边虎尾兰",kind:"snake",pot:["round","#ecebe6"],place:"阳台",base:14,grp:"succ",
  tip:"最怕冬天浇多烂根。宁干勿湿，低于 10℃ 一个月浇一次即可。",thirsty:"叶片起皱、变薄"},
 {id:"p17",name:"斑叶百里香",kind:"thyme",pot:["bowl","#b98a5c"],place:"阳台",base:4,grp:"herb",
  tip:"喜光喜通风，表土干了再浇。现在有不少枯枝，可剪掉枯的部分促发新芽。",thirsty:"枝叶发脆、叶片卷"},
 {id:"p18",name:"多肉组合盆",kind:"combo",pot:["ribbed","#efece4"],place:"阳台",base:10,grp:"succ",
  tip:"唐印、金手指、条纹十二卷混种：按最怕湿的来，干透再浇。",thirsty:"唐印叶片变软起皱"},
 {id:"p19",name:"黑金刚橡皮树",kind:"rubber",pot:["taper","#f0b52f"],place:"阳台",base:7,grp:"leafy",unsure:true,
  tip:"表土干 2–3cm 再浇透。新叶外的红色托叶是正常的。",thirsty:"叶片下垂、失去光泽"}
];

/* ---------- 施肥 ---------- */
// fb: 生长季（约 18℃ 以上）施肥间隔天数，0 = 不施；ft: 肥料建议
const FERT_DEFAULT = {
  leafy:{fb:14, ft:"通用观叶液肥（氮为主），按说明书再多稀释一倍"},
  humid:{fb:21, ft:"观叶液肥，浓度减半，宁淡勿浓"},
  semi: {fb:21, ft:"通用液肥，浓度减半"},
  succ: {fb:30, ft:"多肉专用液肥或少量缓释肥，浓度减半"},
  herb: {fb:30, ft:"通用液肥，浓度减半；香草施肥多了香味会变淡"}
};
const FERT_OVERRIDE = {
  p09:{fb:30, ft:"极稀的液肥兑进泡板的水里，或者稀释后喷叶面"},
  p10:{fb:0,  ft:"生石花基本不需要施肥，施了反而容易徒长、裂皮"},
  p15:{fb:14, ft:"磷钾肥（如磷酸二氢钾，1000 倍）促进开花；冬季短日照是长寿花的花芽期"}
};
function fertConf(p){ return Object.assign({}, FERT_DEFAULT[p.grp]||FERT_DEFAULT.leafy, FERT_OVERRIDE[p.id]||{}); }

/* ---------- 插画 ---------- */
const INK="#3b4339";
function leaf(x,y,len,w,ang,fill,extra=""){
  return `<path d="M0 0 Q ${w} ${-len*0.45} 0 ${-len} Q ${-w} ${-len*0.45} 0 0Z" transform="translate(${x} ${y}) rotate(${ang})" fill="${fill}" stroke="${INK}" stroke-width="1.1" stroke-linejoin="round" ${extra}/>`;
}
function vein(x,y,len,ang,col="#e9f1de"){
  return `<path d="M0 -2 L0 ${-len+3}" transform="translate(${x} ${y}) rotate(${ang})" stroke="${col}" stroke-width="1" fill="none" stroke-linecap="round"/>`;
}
function pot(shape,color,deco){
  const s=`fill="${color}" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"`;
  let p="";
  switch(shape){
    case "vase": p=`<path d="M42 80 L78 80 L76 98 Q75 104 68 104 L68 112 L52 112 L52 104 Q45 104 44 98Z" ${s}/><path d="M46 86 h28 M47 93 h26" stroke="${INK}" stroke-width=".6" opacity=".35"/>`;break;
    case "taper": p=`<path d="M38 80 L82 80 L76 112 L44 112Z" ${s}/><rect x="36" y="77" width="48" height="6" rx="2" ${s}/>`;break;
    case "square": p=`<path d="M44 80 L76 80 L72 112 L48 112Z" ${s}/><path d="M60 80 L56 112" stroke="${INK}" stroke-width=".6" opacity=".3"/>`;break;
    case "hex": p=`<path d="M40 80 L80 80 L76 108 L44 108Z" ${s}/><rect x="38" y="77" width="44" height="6" rx="3" ${s}/><ellipse cx="60" cy="112" rx="20" ry="3" fill="#3b3b3b"/>`;break;
    case "clear": p=`<path d="M38 80 L82 80 L78 112 L42 112Z" ${s} fill-opacity=".55"/><rect x="40" y="94" width="40" height="7" fill="#e9c8d6" opacity=".8"/>`;break;
    case "round": p=`<path d="M40 80 L80 80 Q82 104 70 112 L50 112 Q38 104 40 80Z" ${s}/>`;break;
    case "small": p=`<path d="M44 86 L76 86 L73 112 L47 112Z" ${s}/>`;break;
    case "bucket": p=`<path d="M40 78 L80 78 L77 112 L43 112Z" ${s}/><path d="M50 80 v30 M70 80 v30" stroke="#fff" stroke-width="1.5" opacity=".5"/>`;break;
    case "cyl": p=`<rect x="44" y="82" width="32" height="30" rx="4" ${s}/>`;break;
    case "frill": p=`<path d="M38 78 Q44 74 49 79 Q55 74 60 79 Q65 74 71 79 Q76 74 82 78 L74 112 L46 112Z" ${s}/>`;break;
    case "bowl": p=`<path d="M32 82 L88 82 Q92 100 76 110 L44 110 Q28 100 32 82Z" ${s}/><path d="M36 90 h48 M37 97 h46 M40 104 h40" stroke="${INK}" stroke-width=".5" opacity=".3"/>`;break;
    case "ribbed": p=`<path d="M36 82 L84 82 L80 110 L40 110Z" ${s}/>${[44,51,58,65,72,78].map(x=>`<path d="M${x} 84 L${x-1} 108" stroke="${INK}" stroke-width=".5" opacity=".35"/>`).join("")}`;break;
    case "board": p=`<rect x="36" y="10" width="48" height="66" rx="3" ${s}/><path d="M48 20 q6 10 0 22 M66 30 q-5 12 2 26" stroke="#b08f62" stroke-width="1" fill="none"/><path d="M58 6 L60 10 L62 6" stroke="${INK}" fill="none"/>`;break;
  }
  if(deco==="dots") p+=[[48,92],[60,100],[72,92],[54,106],[68,106]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="2" ry="3" fill="#8fc6e8"/>`).join("");
  if(deco==="leca") p+=[44,52,60,68,76].map((x,i)=>`<circle cx="${x}" cy="${80-(i%2)}" r="3.5" fill="#a8603f" stroke="${INK}" stroke-width=".6"/>`).join("");
  if(deco==="cherry") p+=`<circle cx="52" cy="100" r="4" fill="#d1493e"/><circle cx="62" cy="102" r="4" fill="#d1493e"/><path d="M52 96 Q57 88 62 98" stroke="#5e8a4f" fill="none"/>`;
  return p;
}
function soil(y=80,w=40){return `<ellipse cx="60" cy="${y}" rx="${w/2}" ry="3" fill="#5b4636"/>`;}

function drawPlant(kind){
  let g="";
  const G1="#6f9f66",G2="#4f7d52",G3="#9dc184";
  switch(kind){
    case "grass":
      for(let i=0;i<14;i++){const a=-75+i*11,len=34+((i*7)%14);
        const ex=60+Math.sin(a*Math.PI/180)*len*1.3, ey=78-Math.cos(a*Math.PI/180)*len+ (Math.abs(a)>40?18:0);
        g+=`<path d="M60 79 Q${60+(ex-60)*0.4} ${30+(i%3)*6} ${ex} ${ey}" stroke="${i%2?G1:G3}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;}
      break;
    case "snake":
      [[-28,40],[-12,52],[0,56],[14,50],[30,40],[-40,30],[42,30]].forEach(([a,l],i)=>{
        g+=leaf(60,80,l,7,a,i%2?"#6f9c64":"#86ad73",`stroke="#d9c25a" stroke-width="1.8"`);});
      break;
    case "begonia":
      g+=`<path d="M60 80 L60 22 M60 50 L46 40 M60 38 L72 30" stroke="#6c8d5b" stroke-width="2.2" fill="none"/>`;
      [[46,40,-70],[72,30,60],[60,24,-20],[60,58,70],[60,66,-75],[60,46,55]].forEach(([x,y,a])=>{
        g+=leaf(x,y,24,8,a,"#2f5a3e");
        for(let k=0;k<5;k++){const r=(a)*Math.PI/180,t=4+k*4;g+=`<circle cx="${x+Math.sin(r)*t+(k%2?1.5:-1.5)}" cy="${y-Math.cos(r)*t}" r="1.3" fill="#e6efe8"/>`;}
      });
      g+=leaf(60,24,14,5,25,"#6b3a3f");
      break;
    case "fiddle":
      g+=`<path d="M58 80 L60 14" stroke="#6b4f3a" stroke-width="3" fill="none"/>`;

function art(p){

/* ---------- 状态 ---------- */
let state = {logs:{}, fert:{}, names:{}, adj:{}, remind:"20:00"};
let filter = "all";
let db=null, docRef=null, writing=false, pendingWrite=false, lastSyncedJSON="";
const LS="plant-dash-v1";
try{const s=JSON.parse(localStorage.getItem(LS)||"null"); if(s) state=Object.assign(state,s);}catch(e){}
if(!state.fert) state.fert={};

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const diffDays=(a,b)=>Math.round((parse(ymd(a))-parse(ymd(b)))/864e5);
const TODAY=new Date();
const WEEK="日一二三四五六";

function weatherFor(date){
  const key=ymd(date); const f=FORECAST.days.find(x=>x.d===key);
  if(f) return {t:(f.hi+f.lo)/2, rain:f.rain, rh: f.rh!=null?Math.round(f.rh):(f.rain>=60?85:(f.rain>=30?78:68)), src:"预报"};
  const m=date.getMonth(); return {t:CLIMATE_T[m], rain:30, rh:CLIMATE_RH[m], src:"历年均值"};
}
// 未来 3 天平均
function outlook(from){
  let t=0,rh=0,rain=0,src=new Set();
  for(let i=0;i<3;i++){const w=weatherFor(addDays(from,i));t+=w.t;rh+=w.rh;rain+=w.rain;src.add(w.src);}
  return {t:t/3, rh:rh/3, rain:rain/3, src:[...src].join("+")};
}
function tempFactor(T,grp){
  let f = T>=28?0.75 : T>=22?1 : T>=16?1.25 : T>=10?1.6 : 2.2;
  if((grp==="succ") && T<12) f*=1.3;
  if(grp==="humid") f=Math.min(f,1.5);  // 喜湿的不能拖太久
  return f;
}
function humFactor(rh){ return rh>=80?1.15 : rh<=55?0.85 : 1; }
function interval(p, from=TODAY){
  const o=outlook(from);
  const indoorT = o.t + (p.place==="室内"?5:3);   // 室内/封闭阳台比室外暖
  const tf=tempFactor(indoorT,p.grp), hf=humFactor(o.rh);
  const adj=state.adj[p.id]||0;
  const n=p.fixed ? Math.max(1,p.base+adj) : Math.max(2, Math.round(p.base*tf*hf)+adj);
  return {n, tf, hf, indoorT, o, adj};
}
function lastWater(p){const l=state.logs[p.id]||[];return l.length?l[l.length-1]:null;}
function status(p){
  const last=lastWater(p);
  if(!last) return {code:"none",label:"未记录",left:null};
  const iv=interval(p).n;
  const due=addDays(parse(last),iv);
  const left=diffDays(due,TODAY);
  if(last===ymd(TODAY)) return {code:"done",label:`今天已浇 · ${iv}天后`,left,due};
  if(left<0) return {code:"late",label:`逾期 ${-left} 天`,left,due};
  if(left===0) return {code:"due",label:"今天该浇",left,due};
  if(left===1) return {code:"ok",label:"明天",left,due};
  return {code:"ok",label:`${left} 天后`,left,due};
}
function fertPlan(p, from=TODAY){
  const c=fertConf(p);
  if(!c.fb) return {mode:"never", n:0, ft:c.ft, T:null};
  const o=outlook(from); const T=o.t+(p.place==="室内"?5:3);
  const minT = p.grp==="succ"?18:15;
  if(T<minT) return {mode:"pause", n:0, ft:c.ft, T};
  if(T<18)  return {mode:"half", n:c.fb*2, ft:c.ft, T};
  return {mode:"normal", n:c.fb, ft:c.ft, T};
}
function lastFert(p){const l=state.fert[p.id]||[];return l.length?l[l.length-1]:null;}
function fertStatus(p){
  const fp=fertPlan(p); const last=lastFert(p);
  if(fp.mode==="never") return {code:"never",label:"不用施肥",fp};
  if(last===ymd(TODAY)) return {code:"done",label:"今天已施肥",fp};
  if(fp.mode==="pause") return {code:"pause",label:"冬季暂停施肥",fp};
  if(!last) return {code:"due",label:fp.mode==="half"?"可以施一次（减半）":"可以施一次",fp};
  const due=addDays(parse(last),fp.n); const left=diffDays(due,TODAY);
  if(left<=0) return {code:"due",label:fp.mode==="half"?"该施肥了（减半）":"该施肥了",fp,due};
  return {code:"ok",label:`${left} 天后施肥`,fp,due,left};
}
// 预报里最后一个还能施肥的日子（之后转入冬季暂停）
function fertLastChance(p){
  let lastOk=null;
  for(const d of FORECAST.days){const dt=parse(d.d); if(dt<parse(ymd(TODAY))) continue; if(fertPlan(p,dt).mode!=="pause") lastOk=dt; else break;}
  return lastOk;
}
const nameOf=p=>state.names[p.id]||p.name;
const noOf=p=>p.id.slice(1);

function save(){
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  scheduleWrite();
}
let writeTimer=null;
function scheduleWrite(){ if(!docRef) return; clearTimeout(writeTimer); writeTimer=setTimeout(flush,700); }
async function flush(){
  if(!docRef) return;
  if(writing){pendingWrite=true;return;}
  const json=JSON.stringify(state); if(json===lastSyncedJSON) return;
  writing=true;
  try{await docRef.set(JSON.parse(json)); lastSyncedJSON=json; setSync("已同步到云端，换设备打开也在");}
  catch(e){ setSync("云端同步暂不可用，记录先保存在本机"); }
  writing=false; if(pendingWrite){pendingWrite=false;flush();}
}
function setSync(t){const el=document.getElementById("sync"); if(el) el.textContent=t;}

  }
}
function cloud(rain){
  return rain>=50
   ? `<svg width="46" height="40" viewBox="0 0 46 40"><path d="M12 26 a8 8 0 0 1 2-16 a11 11 0 0 1 21 3 a7 7 0 0 1-1 13z" fill="#e9eef1" stroke="${INK}" stroke-width="1.2"/><path d="M16 31 l-2 5 M24 31 l-2 5 M32 31 l-2 5" stroke="#4f93bd" stroke-width="1.6" stroke-linecap="round"/></svg>`
   : `<svg width="46" height="40" viewBox="0 0 46 40"><circle cx="17" cy="16" r="8" fill="#f3d27a" stroke="${INK}" stroke-width="1.2"/><path d="M16 30 a7 7 0 0 1 2-13 a9 9 0 0 1 17 3 a6 6 0 0 1-1 10z" fill="#f4f6f7" stroke="${INK}" stroke-width="1.2"/></svg>`;
}
function rangeWarn(p){
  if(!p.range) return "";
  const off=p.place==="室内"?5:3;
  const bad=FORECAST.days.find(d=>parse(d.d)>=parse(ymd(TODAY)) && (d.lo+off<p.range[0]+1 || d.hi+off>p.range[1]));
  if(!bad) return "";
  const dt=`${parse(bad.d).getMonth()+1}/${parse(bad.d).getDate()}`;
  return bad.lo+off<p.range[0]+1
    ? `${dt} 夜里室外最低 ${Math.round(bad.lo)}℃，阳台可能接近 ${p.range[0]}℃ 下限，建议当晚搬进屋`
    : `${dt} 阳台可能超过 ${p.range[1]}℃，注意遮阴通风`;
}
function weatherHint(){
  const o=outlook(TODAY);
  const cold=FORECAST.days.find(d=>parse(d.d)>TODAY && d.lo<5);
  let t=[];
  if(o.rain>=50) t.push("这几天阴雨、湿度高，盆土干得慢，浇水间隔已自动拉长。");
  else t.push("这几天雨少一些，可以趁晴天开窗通风。");
  if(cold) t.push(`${parse(cold.d).getMonth()+1}/${parse(cold.d).getDate()} 起明显降温（最低 ${Math.round(cold.lo)}℃），阳台上的观音莲、竹芋、白掌夜里记得关窗或移进屋。`);
  PLANTS.forEach(p=>{const w=rangeWarn(p); if(w) t.push(`${noOf(p)} ${nameOf(p)}：${w}。`);});
  return t.join("<br>");
}

function toggleWater(id){
  const p=PLANTS.find(x=>x.id===id); const t=ymd(TODAY);
  const l=state.logs[id]=(state.logs[id]||[]);
  if(l[l.length-1]===t){ l.pop(); toast(`已取消 ${nameOf(p)} 今天的记录`); }
  else { l.push(t); if(l.length>60) l.splice(0,l.length-60);
    toast(`💧 ${nameOf(p)} 浇好了，下次约 ${interval(p).n} 天后`, ()=>{l.pop();save();render();}); }
  save(); render();
  const b=document.querySelector(`[data-w="${id}"]`); if(b) b.classList.add("pop");
}
function toggleFert(id){
  const p=PLANTS.find(x=>x.id===id); const t=ymd(TODAY);
  const l=state.fert[id]=(state.fert[id]||[]);
  if(l[l.length-1]===t){ l.pop(); toast(`已取消 ${nameOf(p)} 今天的施肥记录`); }
  else { l.push(t); if(l.length>30) l.splice(0,l.length-30);
    const fp=fertPlan(p);
    toast(`🌱 ${nameOf(p)} 施肥完成${fp.mode==="pause"?"":`，下次约 ${fp.n} 天后`}`, ()=>{l.pop();save();render();}); }
  save(); render();
}
let toastT;

  const el=document.getElementById("toast");
  el.innerHTML=`<span>${msg}</span>${undo?`<button id="undo">撤销</button>`:""}`;
  el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),3200);
  if(undo) document.getElementById("undo").onclick=()=>{undo();el.classList.remove("show");};

      <div class="row" style="margin-top:8px">

    if(!l.includes(d)){l.push(d);l.sort();} save();render();openDetail(id);});

function fertBox(p){
  const f=fertStatus(p), fp=f.fp; const logs=(state.fert[p.id]||[]).slice(-4).reverse();
  const lc=fertLastChance(p);
  const modeTxt = fp.mode==="never"?"" : fp.mode==="pause"?`现在${p.place}约 ${Math.round(fp.T)}℃，低于生长温度，<b>暂停施肥</b>，等明年春天回暖（约 3 月）再恢复。`
    : fp.mode==="half"?`现在${p.place}约 ${Math.round(fp.T)}℃，生长变慢：<b>每 ${fp.n} 天一次，浓度再减半</b>。`
    : `生长季：<b>每 ${fp.n} 天一次</b>。`;
  const lcTxt = (fp.mode!=="pause"&&fp.mode!=="never"&&lc&&diffDays(lc,TODAY)<7) ? `<br><span style="color:#8a6d2f">按预报，${lc.getMonth()+1}/${lc.getDate()} 之后降温就进入冬季停肥期，今年最后一次施肥就在这几天。</span>`:"";
  return `<div class="box"><b>🌱 施肥 · ${f.label}</b><br>
    ${modeTxt}${lcTxt}<br><b>用什么：</b>${fp.ft}
    ${fp.mode!=="never"?`<br><span style="color:var(--soft)">施肥前先浇水让土湿润，别在土很干的时候施，容易烧根。</span>
    <div class="log" style="margin-top:6px">${logs.length?"施肥记录："+logs.map(d=>`${parse(d).getMonth()+1}月${parse(d).getDate()}日`).join("　"):"还没有施肥记录"}</div>
    <div class="row"><button class="sbtn ${f.code==="done"?"":"primary"}" id="fertBtn">${f.code==="done"?"撤销今天的施肥":"今天施肥了"}</button>
    ${[7,14,30].map(n=>`<button class="sbtn" data-fback="${n}">${n===30?"约一个月前":n+"天前"}施过</button>`).join("")}</div>`:""}
  </div>`;
}

/* ---------- 提醒：生成日历文件 ---------- */
function buildPlan(days=30){
  // 按当前间隔推算未来 30 天每天要浇哪些（假设每次到期当天就浇）
  const plan={};
  PLANTS.forEach(p=>{
    const last=lastWater(p);
    let next = last ? addDays(parse(last), interval(p).n) : TODAY;
    if(diffDays(next,TODAY)<0) next=new Date(TODAY);
    let guard=0;
    while(diffDays(next,TODAY)<days && guard++<40){
      const k=ymd(next); (plan[k]=plan[k]||{w:[],f:[]}).w.push(nameOf(p));
      next=addDays(next, interval(p,next).n);
    }
    // 施肥
    if(fertConf(p).fb){
      const lf=lastFert(p); let fn = lf ? null : new Date(TODAY); let g2=0;
      if(lf){ const fp=fertPlan(p); fn = fp.n ? addDays(parse(lf),fp.n) : null; }
      while(fn && diffDays(fn,TODAY)<days && g2++<10){
        if(diffDays(fn,TODAY)<0) fn=new Date(TODAY);
        const fp=fertPlan(p,fn); if(fp.mode==="pause") break;
        const k=ymd(fn); (plan[k]=plan[k]||{w:[],f:[]}).f.push(nameOf(p));
        fn=addDays(fn,fp.n);
      }
    }
  });
  return plan;
}
function planTxt(it){return [it.w.length?"💧"+it.w.join("、"):"", it.f.length?"🌱施肥 "+it.f.join("、"):""].filter(Boolean).join("　");}
function buildICS(){
  const plan=buildPlan(30); const [hh,mm]=state.remind.split(":");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  let out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//plant-dashboard//CN","CALSCALE:GREGORIAN","X-WR-CALNAME:浇水施肥提醒"];
  Object.keys(plan).sort().forEach((d,i)=>{
    const ds=d.replace(/-/g,"");
    const items=plan[d];
    out.push("BEGIN:VEVENT",`UID:water-${ds}-${i}@plant-dashboard`,`DTSTAMP:${stamp}`,
      `DTSTART;TZID=Asia/Shanghai:${ds}T${hh}${mm}00`,`DTEND;TZID=Asia/Shanghai:${ds}T${hh}${mm}00`,
      `SUMMARY:${[items.w.length?`💧浇水${items.w.length}盆`:"",items.f.length?`🌱施肥${items.f.length}盆`:""].filter(Boolean).join(" · ")}`,
      `DESCRIPTION:${items.w.length?"浇水："+items.w.join("、"):""}${items.f.length?"\\n施肥（先浇水再施）："+items.f.join("、"):""}\\n\\n做完记得在植物仪表盘里点一下`,
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:该浇水啦","TRIGGER:PT0M","END:VALARM","END:VEVENT");
  });
  out.push("END:VCALENDAR"); return {ics:out.join("\r\n"), plan};
}
function openRemind(){
  const {plan}=buildICS(); const keys=Object.keys(plan).sort().slice(0,6);
  openSheet(`
    <h2>设置手机浇水 / 施肥提醒</h2>
    <div style="font-size:13px;color:var(--soft);line-height:1.6">按现在的天气和浇水记录，推算未来 30 天每天要浇水、施肥的植物，生成一个日历文件。导入三星日历后，到点会弹出提醒。</div>
    <label style="display:block;margin-top:12px">每天提醒时间</label>
    <div class="row"><select id="rt">${["07:30","08:00","12:00","18:30","19:00","20:00","21:00","21:30"].map(t=>`<option ${t===state.remind?"selected":""}>${t}</option>`).join("")}</select></div>
    <div class="box"><b>接下来的安排</b><br>${keys.map(k=>`${parse(k).getMonth()+1}/${parse(k).getDate()}　${planTxt(plan[k])}`).join("<br>")}${Object.keys(plan).length>6?"<br>……":""}</div>
    <div class="row"><button class="sbtn primary" id="dl">生成日历文件</button><button class="sbtn" id="cp">复制提醒清单</button></div>
    <div class="box" id="howto"><b>导入三星日历（约 1 分钟）</b><br>
      ${IN_CLAUDE?`1. 点“生成日历文件”，保存 <b>浇水提醒.txt</b><br>
      2. 打开手机“我的文件” → 下载，长按文件 → 重命名，把结尾 <b>.txt</b> 改成 <b>.ics</b><br>
      3. 点开这个 .ics 文件，选“三星日历”→ 导入<br>`:`1. 点“生成日历文件”，下载 <b>浇水施肥提醒.ics</b><br>
      2. 在下载通知或“我的文件 → 下载”里点开它，选“三星日历”→ 导入<br>
      重新导入前，先在三星日历里删掉旧的提醒，免得重复。<br>`}
      每个月或换季时回来重新生成一次，间隔会跟着天气更新。</div>
    ${IN_CLAUDE?"":`<div class="box"><b>备份记录</b><br>记录只存在这台手机的浏览器里。清除浏览器数据或换手机前，先备份一下。
      <div class="row"><button class="sbtn" id="bk">下载备份</button><label class="sbtn" style="font-size:13px;color:var(--ink)">从备份恢复<input type="file" id="rs" accept=".json,application/json" style="display:none"></label></div></div>`}
    <div class="row"><button class="sbtn" id="cls2">关闭</button></div>
  `);
  const bk=document.getElementById("bk");
  if(bk) bk.onclick=()=>{const blob=new Blob([JSON.stringify(state)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`植物记录备份-${ymd(TODAY)}.json`;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);toast("备份已下载");};
  const rs=document.getElementById("rs");
  if(rs) rs.onchange=async e=>{try{const t=await e.target.files[0].text();const o=JSON.parse(t);if(!o.logs) throw 0;state=Object.assign({logs:{},fert:{},names:{},adj:{},remind:"20:00"},o);save();render();closeSheet();toast("已从备份恢复");}catch(err){toast("这个文件不是有效的备份");}};
  const sh=document.getElementById("sheet");
  sh.querySelector("#rt").onchange=e=>{state.remind=e.target.value;save();};
  sh.querySelector("#cls2").onclick=closeSheet;
  sh.querySelector("#cp").onclick=async()=>{
    const {plan}=buildICS();
    const txt=Object.keys(plan).sort().map(k=>`${parse(k).getMonth()+1}月${parse(k).getDate()}日 ${state.remind}：${planTxt(plan[k])}`).join("\n");
    try{await navigator.clipboard.writeText(txt);toast("已复制，可粘贴到三星“提醒”或备忘录");}catch(e){toast("复制失败，请手动截图保存");}
  };
  sh.querySelector("#dl").onclick=async()=>{
    if(!IN_CLAUDE){
      try{
        const blob=new Blob([buildICS().ics],{type:"text/calendar;charset=utf-8"});
        const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="浇水施肥提醒.ics";
        document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
        toast("已下载，点开文件选“三星日历”导入");
      }catch(e){toast("下载没成功，可先用“复制提醒清单”");}
      return;
    }
    const dl = await claude.use("downloads");
    if(!dl){toast("当前环境不支持保存文件，可先用“复制提醒清单”");return;}
    try{ await dl.save({filename:"浇水提醒.txt", data:buildICS().ics}); toast("已保存，按下面步骤导入三星日历"); }
    catch(e){ if(e&&e.code==="declined") return; toast("保存没成功，可先用“复制提醒清单”"); }
  };
}

/* ---------- 实时天气（仅独立网页可用；在 Claude 里会被拦截，用快照） ---------- */
async function liveWeather(){
  if(IN_CLAUDE) return;
  try{
    const url="https://api.open-meteo.com/v1/forecast?latitude=32.06&longitude=118.79&timezone=Asia%2FShanghai&forecast_days=8"+
      "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,relative_humidity_2m_mean";
    const r=await fetch(url); if(!r.ok) return; const j=await r.json();
    const d=j.daily; if(!d||!d.time) return;
    FORECAST.days=d.time.map((t,i)=>({d:t,hi:d.temperature_2m_max[i],lo:d.temperature_2m_min[i],rain:d.precipitation_probability_max[i]??30,rh:d.relative_humidity_2m_mean?d.relative_humidity_2m_mean[i]:null}));
    const c=j.current||{}; const wc=c.weather_code;
    const txt = wc==null?"" : wc===0?"晴" : wc<=2?"多云" : wc===3?"阴" : wc<=48?"雾" : wc<=57?"毛毛雨" : wc<=67?"雨" : wc<=77?"雪" : wc<=82?"阵雨" : wc<=86?"阵雪" : "雷雨";
    FORECAST.now={t:c.temperature_2m??FORECAST.days[0].hi, text:txt}; FORECAST.updated=ymd(TODAY); FORECAST.live=true;
    render();
  }catch(e){}
}
/* ---------- 云端同步 ---------- */
render(); liveWeather();
(async()=>{
  if(!window.claude) return;
  try{
    db = await claude.use("db"); if(!db){setSync("记录保存在本机浏览器");return;}
    docRef = db.doc("garden/state");
    let first=true;
    const timer=setTimeout(()=>setSync("云端暂时连不上，记录先保存在本机"),10000);
    docRef.onSnapshot(snap=>{
      if(!snap.metadata.fromCache) clearTimeout(timer);
      if(snap.exists){
        const remote=snap.data();
        const json=JSON.stringify(remote);
        if(json!==JSON.stringify(state)){
          // 首次载入：合并本机记录与云端记录
          const merged={logs:{},fert:{},names:Object.assign({},state.names,remote.names||{}),adj:Object.assign({},state.adj,remote.adj||{}),remind:remote.remind||state.remind};
          const ids=new Set([...Object.keys(state.logs),...Object.keys(remote.logs||{})]);
          const fids=new Set([...Object.keys(state.fert||{}),...Object.keys(remote.fert||{})]);
          fids.forEach(i=>{ merged.fert[i] = first ? [...new Set([...((state.fert||{})[i]||[]),...((remote.fert||{})[i]||[])])].sort() : ((remote.fert||{})[i]||[]); });
          ids.forEach(i=>{ merged.logs[i] = first ? [...new Set([...(state.logs[i]||[]),...((remote.logs||{})[i]||[])])].sort() : ((remote.logs||{})[i]||[]); });
          state=merged; lastSyncedJSON=json;
          try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
          render(); if(first && JSON.stringify(state)!==json) scheduleWrite();
        }
      } else if(first){ scheduleWrite(); }
      if(!snap.metadata.fromCache) setSync("已同步到云端，换设备打开也在");
      first=false;
    }, err=>{ clearTimeout(timer); setSync("云端同步暂不可用，记录先保存在本机"); });
  }catch(e){ setSync("记录保存在本机浏览器"); }
})();
